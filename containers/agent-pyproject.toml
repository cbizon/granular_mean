[project]
name = "granular-mean-agent"
version = "0.1.0"
description = "Candidate-side launcher for the Granular Mean benchmark"
requires-python = ">=3.12,<3.14"
dependencies = [
    "brunner",
]

[project.scripts]
granular-mean-codex = "granular_mean.codex_wrapper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/granular_mean"]
