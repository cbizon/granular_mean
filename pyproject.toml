[project]
name = "granular-mean"
version = "0.1.0"
description = "Brunner benchmark for reproducing Bizon et al. Figure 1"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "brunner",
    "numpy>=2.0,<2.3",
    "pillow>=10",
    "scipy>=1.14",
]

[project.scripts]
granular-mean-codex = "granular_mean.codex_wrapper:main"
granular-reference = "granular_mean.reference:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
]

[tool.uv.sources]
brunner = { path = "../brunner", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/granular_mean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["granular_mean"]

[tool.coverage.report]
show_missing = true
skip_covered = true
